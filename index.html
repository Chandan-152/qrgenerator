<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bin QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;padding:16px 12px 30px}
h1{text-align:center;font-size:24px;margin:4px 0}
.sub{text-align:center;color:#6b7280;font-size:13px;margin:5px 0 16px}
.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 3px 14px rgba(0,0,0,.07)}
.title{font-weight:800;font-size:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
button{border:0;border-radius:10px;background:#eef0f3;color:#111827;font-size:16px;font-weight:700;min-height:46px;cursor:pointer}
button.active{background:#111827;color:#fff}
.rack-grid{grid-template-columns:repeat(6,1fr)}
.level-grid{grid-template-columns:repeat(6,1fr)}
.pos-grid{grid-template-columns:repeat(3,1fr)}
.pos-grid button{min-height:50px;font-size:18px}
.location{background:#f0f1f3;border-radius:12px;padding:13px;text-align:center;margin:14px 0}
.location small{display:block;color:#6b7280;font-size:12px;margin-bottom:4px}
.location strong{font-size:22px;letter-spacing:.4px}
.primary{width:100%;background:#111827;color:#fff;min-height:52px;font-size:17px}
.secondary{width:100%;margin-top:9px;background:#e5e7eb;min-height:46px}
.qr{display:none;text-align:center}
#qrcode{display:flex;justify-content:center;margin:8px 0 12px}
#qrcode img,#qrcode canvas{width:250px!important;height:250px!important}
.qr-code-label{font-weight:800;font-size:18px;word-break:break-all;margin-bottom:12px}
.note{text-align:center;color:#6b7280;font-size:12px;line-height:1.4;margin-top:9px}
@media(max-width:360px){.grid{grid-template-columns:repeat(3,1fr)}.rack-grid{grid-template-columns:repeat(5,1fr)}}
@media print{
body{background:#fff}.app{padding:0}.header,.controls{display:none!important}.qr{display:block!important;box-shadow:none;margin:0;padding:20px}
#qrcode img,#qrcode canvas{width:300px!important;height:300px!important}
}
</style>
</head>
<body>
<main class="app">
<header class="header">
<h1>Bin QR Generator</h1>
<div class="sub">Fast phone-friendly location QR</div>
</header>

<section class="card controls">
<div class="title">Aisle</div>
<div id="aisles" class="grid"></div>

<div class="title" style="margin-top:16px">Rack</div>
<div id="racks" class="grid rack-grid"></div>

<div class="title" style="margin-top:16px">Level</div>
<div id="levels" class="grid level-grid"></div>

<div class="title" style="margin-top:16px">Position</div>
<div id="positions" class="grid pos-grid"></div>

<div class="location">
<small>BIN LOCATION</small>
<strong id="location">F0-A01-001-01-A</strong>
</div>

<button id="generate" class="primary">Generate QR</button>
<button id="reset" class="secondary">Reset</button>

</section>

<section id="qrCard" class="card qr">
<div class="qr-code-label" id="qrLabel"></div>
<div id="qrcode"></div>
<button id="print" class="primary">Print QR</button>
<div class="note">Print button phone ke print dialog ko open karega.</div>

<details style="margin-top:16px;text-align:left">
  <summary style="cursor:pointer;font-weight:700;color:#4b5563;padding:8px 2px">Manual QR (rarely used)</summary>
  <input id="manualText" type="text" placeholder="Enter any text/code"
    style="width:100%;height:50px;margin-top:10px;border:1px solid #d5d9df;border-radius:11px;padding:0 12px;font-size:16px">
  <button id="manualGenerate" class="secondary">Generate Manual QR</button>
</details>
</section>
</main>

<script>
const config={
 A01:{r:11,l:9},A02:{r:22,l:12},
 A03:{r:12,l:9},A04:{r:12,l:9},A05:{r:12,l:9},
 A06:{r:12,l:9},A07:{r:12,l:9},A08:{r:12,l:9},
 A09:{r:12,l:9},A10:{r:12,l:9},A11:{r:12,l:9},
 A12:{r:12,l:9},A13:{r:12,l:9},A14:{r:12,l:9},
 A15:{r:12,l:9},CR01:{r:28,l:9},FR01:{r:17,l:9}
};

let selected={aisle:'A01',rack:'001',level:'01',pos:'A'};

const $=id=>document.getElementById(id);
const locationEl=$('location');

function makeButtons(container,items,key){
 const el=$(container);el.innerHTML='';
 items.forEach(v=>{
  const b=document.createElement('button');
  b.textContent=v;
  b.dataset.value=v;
  if(selected[key]===v)b.classList.add('active');
  b.onclick=()=>{
   selected[key]=v;
   if(key==='aisle'){selected.rack='001';selected.level='01';renderRacks();renderLevels();}
   if(key==='rack')renderRacks();
   if(key==='level')renderLevels();
   makeButtons(container,items,key);
   updateLocation();
  };
  el.appendChild(b);
 });
}

function renderAisles(){
 makeButtons('aisles',Object.keys(config),'aisle');
}
function renderRacks(){
 const n=config[selected.aisle].r;
 makeButtons('racks',Array.from({length:n},(_,i)=>String(i+1).padStart(3,'0')),'rack');
}
function renderLevels(){
 const n=config[selected.aisle].l;
 makeButtons('levels',Array.from({length:n},(_,i)=>String(i+1).padStart(2,'0')),'level');
}
function renderPositions(){
 makeButtons('positions',['A','B','C'],'pos');
}
function updateLocation(){
 locationEl.textContent=`F0-${selected.aisle}-${selected.rack}-${selected.level}-${selected.pos}`;
}
function render(){
 renderAisles();renderRacks();renderLevels();renderPositions();updateLocation();
}
function generateQR(code){
 code=(code||'').trim();
 if(!code)return;
 $('qrcode').innerHTML='';
 $('qrLabel').textContent=code;
 new QRCode($('qrcode'),{text:code,width:250,height:250,correctLevel:QRCode.CorrectLevel.H});
 $('qrCard').style.display='block';
}

function autoGenerate(){
 generateQR(locationEl.textContent);
}

// Manual button
$('manualGenerate').onclick=()=>{
 const value=$('manualText').value;
 if(!value.trim()){
   $('manualText').focus();
   return;
 }
 generateQR(value);
 $('qrCard').scrollIntoView({behavior:'smooth',block:'start'});
};

// Keep the explicit Generate QR button too
$('generate').onclick=()=>{
 generateQR(locationEl.textContent);
 $('qrCard').scrollIntoView({behavior:'smooth',block:'start'});
};

// Automatically regenerate whenever a standard location changes
const originalUpdateLocation=updateLocation;
updateLocation=function(){
 originalUpdateLocation();
 autoGenerate();
};
$('print').onclick=()=>window.print();
$('reset').onclick=()=>{
 selected={aisle:'A01',rack:'001',level:'01',pos:'A'};
 $('qrCard').style.display='none';
 $('qrcode').innerHTML='';
 render();
};
render();
autoGenerate();
</script>
</body>
</html>
