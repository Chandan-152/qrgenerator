<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Bin QR Generator</title>


<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
}


/* =====================================================
   MAIN APP
===================================================== */

.app{
  max-width:520px;
  margin:auto;
  padding:12px 10px 25px;
}


/* =====================================================
   HEADER
===================================================== */

h1{
  text-align:center;
  font-size:23px;
  margin:5px 0;
}

.sub{
  text-align:center;
  color:#6b7280;
  font-size:12px;
  margin-bottom:12px;
}


/* =====================================================
   CARD
===================================================== */

.card{
  background:#fff;
  border-radius:16px;
  padding:13px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}


/* =====================================================
   TITLES
===================================================== */

.title{
  font-weight:800;
  font-size:15px;
  margin-bottom:8px;
}


/* =====================================================
   BUTTON GRID
===================================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}


/* =====================================================
   BUTTON
===================================================== */

button{
  border:0;
  border-radius:9px;
  background:#eef0f3;
  color:#111827;
  font-size:15px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

button.active{
  background:#111827;
  color:#fff;
}


/* =====================================================
   RACK GRID
===================================================== */

.rack-grid{
  grid-template-columns:repeat(6,1fr);
}


/* =====================================================
   LEVEL GRID
===================================================== */

.level-grid{
  grid-template-columns:repeat(6,1fr);
}


/* =====================================================
   POSITION GRID
===================================================== */

.pos-grid{
  grid-template-columns:repeat(6,1fr);
}

.pos-grid button{
  min-height:48px;
  font-size:17px;
}


/* =====================================================
   QR CARD
===================================================== */

.qr-card{
  display:block;
  text-align:center;
}

.qr-label{
  font-weight:800;
  font-size:18px;
  margin-bottom:8px;
  word-break:break-all;
}

#qrcode{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:250px;
}

#qrcode img,
#qrcode canvas{
  width:250px !important;
  height:250px !important;
}

.note{
  color:#6b7280;
  font-size:11px;
  margin-top:8px;
}


/* =====================================================
   MANUAL QR BUTTON
===================================================== */

.manual-area{
  display:flex;
  justify-content:flex-end;
  margin-top:8px;
}

.manual-btn{
  min-height:38px;
  padding:8px 14px;
  border:1px solid #d1d5db;
  border-radius:20px;
  background:#fff;
  color:#374151;
  font-size:13px;
  font-weight:700;
}


/* =====================================================
   MANUAL QR BOX
===================================================== */

.manual-box{
  display:none;
  margin-top:8px;
  padding:11px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
}

.manual-box.show{
  display:block;
}


/* =====================================================
   MANUAL INPUT
===================================================== */

.manual-input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

.manual-input:focus{
  border-color:#111827;
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:360px){

  .app{
    padding:10px 8px 20px;
  }

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .rack-grid{
    grid-template-columns:repeat(5,1fr);
  }

  .level-grid{
    grid-template-columns:repeat(5,1fr);
  }

  .pos-grid{
    grid-template-columns:repeat(3,1fr);
  }

  button{
    min-height:42px;
    font-size:14px;
  }

  .qr-label{
    font-size:17px;
  }

  #qrcode img,
  #qrcode canvas{
    width:230px !important;
    height:230px !important;
  }

}

</style>

</head>


<body>


<main class="app">


  <!-- =================================================
       HEADER
  ================================================== -->

  <h1>Bin QR Generator</h1>

  <div class="sub">
    Fast phone-friendly location QR
  </div>



  <!-- =================================================
       LOCATION CONTROLS
  ================================================== -->

  <section class="card">


    <!-- AISLE -->

    <div class="title">
      Aisle
    </div>

    <div
      id="aisles"
      class="grid">
    </div>



    <!-- RACK -->

    <div
      class="title"
      style="margin-top:15px;">

      Rack

    </div>

    <div
      id="racks"
      class="grid rack-grid">
    </div>



    <!-- LEVEL -->

    <div
      class="title"
      style="margin-top:15px;">

      Level

    </div>

    <div
      id="levels"
      class="grid level-grid">
    </div>



    <!-- POSITION -->

    <div
      class="title"
      style="margin-top:15px;">

      Position

    </div>

    <div
      id="positions"
      class="grid pos-grid">
    </div>


  </section>



  <!-- =================================================
       QR CARD
  ================================================== -->

  <section class="card qr-card">


    <!-- CURRENT QR VALUE -->

    <div
      class="qr-label"
      id="qrLabel">

      F0-A01-001-01-A

    </div>


    <!-- QR -->

    <div id="qrcode"></div>


    <div class="note">

      QR automatically updates when location changes.

    </div>


  </section>



  <!-- =================================================
       MANUAL QR BUTTON
  ================================================== -->

  <div class="manual-area">

    <button
      class="manual-btn"
      id="manualToggle">

      ＋ Manual QR

    </button>

  </div>



  <!-- =================================================
       MANUAL QR INPUT
  ================================================== -->

  <div
    class="manual-box"
    id="manualBox">

    <input
      id="manualInput"
      class="manual-input"
      type="text"
      autocomplete="off"
      placeholder="Enter any text / QR value">

  </div>


</main>



<script>


/* =====================================================
   LOCATION CONFIG
===================================================== */

const config = {


  /* A01 */

  A01:{
    r:11,
    l:9
  },


  /* A02 */

  A02:{
    r:22,
    l:12
  },


  /* A03 */

  A03:{
    r:12,
    l:9
  },


  /* A04 */

  A04:{
    r:12,
    l:9
  },


  /* A05 */

  A05:{
    r:12,
    l:9
  },


  /* A06 */

  A06:{
    r:12,
    l:9
  },


  /* A07 - 13 RACKS */

  A07:{
    r:13,
    l:9
  },


  /* A08 */

  A08:{
    r:12,
    l:9
  },


  /* A09 */

  A09:{
    r:12,
    l:9
  },


  /* A10 */

  A10:{
    r:12,
    l:9
  },


  /* A11 - 6 POSITIONS */

  A11:{
    r:12,
    l:12
  },


  /* A12 */

  A12:{
    r:12,
    l:9
  },


  /* A13 */

  A13:{
    r:12,
    l:9
  },


  /* A14 */

  A14:{
    r:12,
    l:9
  },


  /* A15 */

  A15:{
    r:12,
    l:9
  },


  /* FV01 */

  FV01:{
    r:12,
    l:12
  },


  /* CR01 */

  CR01:{
    r:28,
    l:9
  },


  /* FR01 */

  FR01:{
    r:17,
    l:9
  }

};



/* =====================================================
   CURRENT SELECTION
===================================================== */

let selected = {

  aisle:"A01",

  rack:"001",

  level:"01",

  pos:"A"

};



/* =====================================================
   SHORT SELECTOR
===================================================== */

const $ = id =>
  document.getElementById(id);



/* =====================================================
   CREATE BUTTONS
===================================================== */

function makeButtons(
  container,
  items,
  key
){

  const el =
    $(container);


  /* Clear old buttons */

  el.innerHTML = "";


  /* Create new buttons */

  items.forEach(value => {


    const btn =
      document.createElement("button");


    btn.textContent =
      value;


    /* Active button */

    if(
      selected[key] === value
    ){

      btn.classList.add(
        "active"
      );

    }


    /* Button click */

    btn.onclick =
      function(){


        selected[key] =
          value;



        /* -----------------------------------------
           AISLE CHANGE
        ----------------------------------------- */

        if(
          key === "aisle"
        ){

          /*
             Reset rack
          */

          selected.rack =
            "001";


          /*
             Reset level
          */

          selected.level =
            "01";


          /*
             Reset position
          */

          selected.pos =
            "A";


          /*
             Re-render dependent buttons
          */

          renderRacks();

          renderLevels();

          renderPositions();

        }



        /*
           Re-render current button group
        */

        makeButtons(
          container,
          items,
          key
        );



        /*
           Update QR
        */

        updateLocation();

      };


    el.appendChild(btn);

  });

}



/* =====================================================
   RENDER AISLES
===================================================== */

function renderAisles(){

  makeButtons(

    "aisles",

    Object.keys(config),

    "aisle"

  );

}



/* =====================================================
   RENDER RACKS
===================================================== */

function renderRacks(){


  const total =
    config[selected.aisle].r;



  /*
     Create:

     001
     002
     003
     ...
  */

  const racks =
    Array.from(

      {
        length:total
      },

      (_,i) =>

        String(i + 1)
          .padStart(3,"0")

    );



  makeButtons(

    "racks",

    racks,

    "rack"

  );

}



/* =====================================================
   RENDER LEVELS
===================================================== */

function renderLevels(){


  const total =
    config[selected.aisle].l;



  /*
     Create:

     01
     02
     03
     ...
  */

  const levels =
    Array.from(

      {
        length:total
      },

      (_,i) =>

        String(i + 1)
          .padStart(2,"0")

    );



  makeButtons(

    "levels",

    levels,

    "level"

  );

}



/* =====================================================
   RENDER POSITIONS
===================================================== */

function renderPositions(){

  let positions;



  /*
     A11 ONLY:

     A B C D E F
  */

  if(
    selected.aisle === "A11"
  ){

    positions = [

      "A",
      "B",
      "C",
      "D",
      "E",
      "F"

    ];

  }



  /*
     ALL OTHER AISLES:

     A B C
  */

  else{

    positions = [

      "A",
      "B",
      "C"

    ];

  }



  /*
     If current position
     does not exist
  */

  if(
    !positions.includes(
      selected.pos
    )
  ){

    selected.pos =
      "A";

  }



  makeButtons(

    "positions",

    positions,

    "pos"

  );

}



/* =====================================================
   GENERATE QR
===================================================== */

function generateQR(code){


  /*
     Convert to string
  */

  code =
    String(code || "")
      .trim();



  /*
     Do nothing if empty
  */

  if(!code){

    return;

  }



  const qrBox =
    $("qrcode");


  const qrLabel =
    $("qrLabel");



  /*
     Remove previous QR
  */

  qrBox.innerHTML =
    "";



  /*
     Show QR text
  */

  qrLabel.textContent =
    code;



  /*
     Check QR library
  */

  if(
    typeof QRCode === "undefined"
  ){

    qrBox.innerHTML =
      "<p style='color:#777;font-size:13px'>QR library loading...</p>";

    return;

  }



  /*
     Generate QR
  */

  new QRCode(

    qrBox,

    {

      text:code,

      width:250,

      height:250,

      correctLevel:
        QRCode.CorrectLevel.H

    }

  );

}



/* =====================================================
   UPDATE LOCATION QR
===================================================== */

function updateLocation(){


  const code =

    `F0-${selected.aisle}-${selected.rack}-${selected.level}-${selected.pos}`;



  generateQR(code);

}



/* =====================================================
   MANUAL QR BUTTON
===================================================== */

$("manualToggle").onclick =
  function(){


    const box =
      $("manualBox");



    /*
       Open / close box
    */

    box.classList.toggle(
      "show"
    );



    /*
       Focus input
    */

    if(
      box.classList.contains(
        "show"
      )
    ){

      $("manualInput").focus();

    }

  };



/* =====================================================
   MANUAL QR AUTO GENERATE
===================================================== */

$("manualInput").addEventListener(

  "input",

  function(){


    const value =
      this.value.trim();



    /*
       If empty,
       don't change current QR
    */

    if(!value){

      return;

    }



    /*
       Automatically generate QR
       while typing
    */

    generateQR(value);

  }

);



/* =====================================================
   ENTER KEY
===================================================== */

$("manualInput").addEventListener(

  "keydown",

  function(event){


    if(
      event.key === "Enter"
    ){

      const value =
        this.value.trim();



      if(!value){

        return;

      }



      generateQR(value);



      /*
         Scroll to QR
      */

      document
        .querySelector(".qr-card")
        .scrollIntoView({

          behavior:"smooth",

          block:"start"

        });

    }

  }

);



/* =====================================================
   START APPLICATION
===================================================== */

renderAisles();

renderRacks();

renderLevels();

renderPositions();

updateLocation();


</script>

</body>

</html>
